<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;

        }

        body {
            background: none;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 360px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 15);
            text-align: center;
        }

         .logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 50%; /* Makes the image a perfect circle */
            border: 3px solid #f1f5f9; /* Adds a clean border ring */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }






    p {
            width: 100%;
            padding: 12px;
            background-color: rgb(38, 77, 237);
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
           
            
        }
        a {
            text-decoration: none;
        }
        p:hover {
            background: rgb(2, 2, 86);
        }
    </style>

</head>

<body>
 

    <div class="container">
        
        <div class="logo-container">
            <img src="./Jiraiya’s Goofy Circular Avatar.png" alt="Company Logo">
            <span>Mr SuMiT</span>
        </div>
        <h2>Before Contact with me please select you gender</h2>
        <form action="">
           <a href="./contact1.html"> <p>Male</p></a>
            <br>
           <a href="./contact2.html"><p>Female</p></a>

        </form>


    </div>


</body>

</html>
