<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;

        }

        body {
            background: none;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width:350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 15);
            text-align: center;
        }

        h2{
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

label{
    float: left;
    font-weight: bold;
    margin-bottom: 5px;
    color: #555;
}

input[type="text"],
input[type="password"]
{
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    transition: 0.3s;
}

input[type="text"]:hover,
input[type="password"]:hover{
    border-color: aqua;
}

input[type="submit"]{
    width: 100%;
    padding: 12px;
    background-color: rgb(38, 77, 237);
    border: none;
    color: white;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

input[type="submit"]:hover{
    background: rgb(2, 2, 86);
}

p{
    margin-top: 15px;
    color: #333;
    font-size: 15px;
}

a{
    color: blue;
    font-weight: bold;
    text-decoration: none;
}

a:hover{
    text-decoration: underline;
}
    </style>

</head>

<body>

   
<div class="container">
    <h2>Login</h2>
    <form action="">
        <label>Username:</label>
        <input type="text" placeholder="Enter Username" required>
        <br><br>

        <label>password:</label>
        <input type="password" placeholder="Enter password" required>
        <br>

        
        <input type="submit" value="Login">
    </form>

    <p>Don't have account? <a href="register.html">signup here</a></p>
    </div>
</body>

</html>
