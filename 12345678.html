<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            width: 360px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 20px 48px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        /* Optimized for Circular Logos */
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 50%; /* Makes the image a perfect circle */
            border: 3px solid #f1f5f9; /* Adds a clean border ring */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-bottom: 24px;
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 20px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            color: #334155;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #94a3b8;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        input[type="submit"]:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }

        p {
            margin-top: 24px;
            color: #64748b;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Replace 'logo.png' with your actual circular image file name -->
        <div class="logo-container">
            <img src="./jiraiya logo.png" alt="Company Logo">
        </div>

        <h2>Login</h2>
        <form action="">
            <label>Username</label>
            <input type="text" placeholder="Enter Username" required>

            <label>Password</label>
            <input type="password" placeholder="Enter Password" required>

            <input type="submit" value="Login">
        </form>

        <p>Don't have an account? <a href="register.html">Sign up here</a></p>
    </div>

</body>
</html>
